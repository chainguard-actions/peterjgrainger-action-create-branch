name: Test branch creation with specific SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current HEAD SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current HEAD SHA: $SHA"
      - id: action
        uses: .
        with:
          branch: test-sha-branch
          sha: ${{ steps.get-sha.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert created output is set
        env:
          ACTUAL: ${{ steps.action.outputs.created }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'created' output to be set"
            exit 1
          fi
          echo "PASS: created=$ACTUAL"
