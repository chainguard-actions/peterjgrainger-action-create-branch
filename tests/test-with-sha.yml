name: Test branch creation with SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"
      - id: action
        uses: .
        with:
          branch: test-branch-with-sha
          sha: ${{ steps.get-sha.outputs.sha }}
        continue-on-error: true
      - name: Assert created output is set
        env:
          CREATED: ${{ steps.action.outputs.created }}
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.get-sha.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created: $CREATED"
          echo "sha used: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CREATED" != "true" ] && [ "$CREATED" != "false" ]; then
              echo "FAIL: expected created to be 'true' or 'false', got '$CREATED'"
              exit 1
            fi
            echo "PASS: created=$CREATED"
          else
            echo "INFO: action did not succeed (likely no real GitHub token in act), outcome=$OUTCOME"
            echo "PASS: action ran and produced an outcome"
          fi
